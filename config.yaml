# 동적 설정 레지스트리 (법령·세무·벤처제도 파라미터 하드코딩 배제용 단일 진실 공급원)
dynamic_config_registry:
  - config_group: "venture_tax_incentives"
    config_key: "indiv_angel_deduction_tier1_rate"
    config_label: "개인 벤처·개인투자조합 직접투자 소득공제율 (3천만원 이하 구간)"
    config_value: "100"
    unit: "%"
    legal_basis: "조세특례제한법 제16조 제1항"
    effective_date: "2026-01-01"
    description: "벤처기업 또는 창업 후 3년 이내 기술우수 중소기업 직접·개인투자조합 출자분 소득공제"
  - config_group: "venture_tax_incentives"
    config_key: "indiv_angel_deduction_tier2_rate"
    config_label: "개인 벤처·개인투자조합 직접투자 소득공제율 (3천만~5천만원 구간)"
    config_value: "70"
    unit: "%"
    legal_basis: "조세특례제한법 제16조 제1항"
    effective_date: "2026-01-01"
    description: "3천만원 초과 5천만원 이하 출자 구간 소득공제율 (5천만원 초과분은 별도 구간율 적용)"
  - config_group: "venture_tax_incentives"
    config_key: "indiv_angel_deduction_tier3_rate"
    config_label: "개인 벤처·개인투자조합 직접투자 소득공제율 (5천만원 초과 구간)"
    config_value: "30"
    unit: "%"
    legal_basis: "조세특례제한법 제16조 제1항"
    effective_date: "2026-01-01"
    description: "종합소득금액의 한도 비율 내에서 공제 적용"
  - config_group: "venture_tax_incentives"
    config_key: "indiv_venture_fund_deduction_rate"
    config_label: "벤처투자조합(VC펀드) 개인 출자 소득공제율"
    config_value: "10"
    unit: "%"
    legal_basis: "조세특례제한법 제16조 제1항 제1호"
    effective_date: "2026-01-01"
    description: "벤처투자조합·신기술사업투자조합 등에 출자하는 경우 출자액 기준 소득공제"
  - config_group: "venture_tax_incentives"
    config_key: "corp_venture_investment_tax_credit_base"
    config_label: "내국법인 벤처기업·벤처투자조합 출자 세액공제 (기본율)"
    config_value: "5"
    unit: "%"
    legal_basis: "조세특례제한법 제13조의2"
    effective_date: "2026-01-01"
    description: "내국법인이 민간재간접벤처투자조합·벤처기업 등에 출자 시 출자액 기본 세액공제율 (증가분 추가공제 별도)"
  - config_group: "venture_tax_incentives"
    config_key: "corp_venture_investment_tax_credit_increment"
    config_label: "내국법인 벤처출자 증가분 추가 세액공제율"
    config_value: "3"
    unit: "%"
    legal_basis: "조세특례제한법 제13조의2"
    effective_date: "2026-01-01"
    description: "직전 3개 과세연도 평균 출자·투자금액 초과분에 대한 추가 법인세 세액공제율"
  - config_group: "venture_tax_incentives"
    config_key: "startup_venture_corp_tax_reduction_rate"
    config_label: "창업벤처중소기업 법인세·소득세 감면율 (5년간)"
    config_value: "50"
    unit: "%"
    legal_basis: "조세특례제한법 제6조"
    effective_date: "2026-01-01"
    description: "창업 후 3년 이내 벤처확인 신기술창업기업 대상 최초 소득발생 과세연도부터 5년간 감면(청년·비수도권 우대 별도)"
  - config_group: "venture_fund_regulations"
    config_key: "vc_fund_mandatory_investment_ratio"
    config_label: "벤처투자조합 법정 의무투자 비율 (창업·벤처기업)"
    config_value: "40"
    unit: "%"
    legal_basis: "벤처투자 촉진에 관한 법률 제51조 및 시행령 제35조"
    effective_date: "2026-01-01"
    description: "결성일로부터 3년 이내 조합 결성총액 대비 중소·벤처·창업기업 의무투자 최소 기준 (모태출자 주목적 비율 별도)"
  - config_group: "venture_fund_regulations"
    config_key: "motae_standard_primary_purpose_ratio"
    config_label: "모태펀드 출자 자펀드 표준 주목적 투자 의무비율"
    config_value: "60"
    unit: "%"
    legal_basis: "한국모태펀드 운용규정 및 출자공고 기준"
    effective_date: "2026-01-01"
    description: "모태펀드 출자 계정별 주목적 분야(초격차·창업초기·지역·세컨더리 등) 약정총액 대비 기본 의무투자 기준"
  - config_group: "venture_fund_regulations"
    config_key: "vc_fund_listed_stock_cap_ratio"
    config_label: "벤처투자조합 상장법인 주식 투자 한도"
    config_value: "20"
    unit: "%"
    legal_basis: "벤처투자 촉진에 관한 법률 시행령 제35조"
    effective_date: "2026-01-01"
    description: "유가증권·코스닥 상장주식 투자 상한 비율"
  - config_group: "venture_fund_regulations"
    config_key: "cvc_external_lp_cap_ratio"
    config_label: "일반지주회사 CVC 펀드 외부자금 출자 허용 한도"
    config_value: "40"
    unit: "%"
    legal_basis: "독점규제 및 공정거래에 관한 법률 제20조 (완화 추진안 반영 가능)"
    effective_date: "2026-01-01"
    description: "일반지주회사 소속 기업형 벤처캐피탈(CVC) 결성 투자조합의 외부 LP 자금 조달 한도"
  - config_group: "venture_fund_regulations"
    config_key: "multiple_voting_rights_threshold_krw"
    config_label: "비상장 벤처기업 복수의결권 발행 누적투자 요건"
    config_value: "100"
    unit: "억원"
    legal_basis: "벤처기업육성에 관한 특별조치법 제16조의11"
    effective_date: "2026-01-01"
    description: "창업주 지분 30% 미만 하락 시 복수의결권(1주당 최대 10개) 발행을 위한 누적 투자유치 최소 금액(마지막 투자 50억원 이상)"

settings:
  poll_interval_minutes: 30
  db_path: "dealsourcing.db"
